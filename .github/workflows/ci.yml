name: CI

on:
  pull_request: {}

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    permissions:
      contents: read
    uses: ljmerza/misc-actions/.github/workflows/python-tests.yml@v2
    with:
      python-version: "3.12"
      coverage-source: app
    secrets: inherit

  build:
    # PR images are throwaway (pr-N tags), so build them alongside the tests instead of after them; main and release
    # builds (build-and-push.yml) still wait for the tests.
    permissions:
      contents: read
      packages: write
    uses: ljmerza/misc-actions/.github/workflows/docker-ci.yml@v2
    with:
      image-name: ghcr.io/${{ github.repository_owner }}/minidsp-webui
    secrets: inherit
