  <div class="banner banner-warn adopt-banner" role="note">

    (<span aria-hidden="true">?</span>) until it is sent. Use <a href="{{ root }}/device#adopt">Set up this device</a>
    to tell it, without writing anything.
  </div>
{% endif %}
