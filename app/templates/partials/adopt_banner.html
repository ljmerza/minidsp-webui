{% if needs_adoption %}
  <div class="banner banner-warn adopt-banner" role="note">
    This device hasn't been adopted yet: the app doesn't know what it holds, so every setting shows as unknown
    (<span aria-hidden="true">?</span>) until it is written. Run the <a href="{{ root }}/device#adopt">adopt wizard</a>
    to tell it, without writing anything.
  </div>
{% endif %}
